name: CI

on:
  push:
    branches: ["**"]
  pull_request:

defaults:
  run:
    working-directory: anim-kit

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: anim-kit/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # tsc (ESM + .d.ts) + CSS copy + tsup standalone bundle
      - name: Build
        run: npm run build

      # unit smoke + demo wiring smoke (includes standalone API parity)
      - name: Test
        run: npm run smoke

      # tarball must contain dist/, src/, README, LICENSE — nothing else
      - name: Verify publish contents
        run: |
          npm pack --dry-run 2>&1 | tee "$RUNNER_TEMP/pack.log"
          grep -q "dist/index.js" "$RUNNER_TEMP/pack.log"
          grep -q "dist/index.d.ts" "$RUNNER_TEMP/pack.log"
          grep -q "dist/anim-kit.standalone.js" "$RUNNER_TEMP/pack.log"
          grep -q "dist/styles/anim-kit.css" "$RUNNER_TEMP/pack.log"
